name: Android CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Verify translation resource parity
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET

          res = pathlib.Path("app/src/main/res")
          default_root = ET.parse(res / "values" / "strings.xml").getroot()
          required = {
              node.attrib["name"]
              for node in default_root
              if node.tag in {"string", "plurals"}
              and node.attrib.get("translatable", "true") != "false"
          }

          locale_root = ET.parse(res / "xml" / "locales_config.xml").getroot()
          android_name = "{http://schemas.android.com/apk/res/android}name"
          failures = []

          cp1252_inverse = {}
          for byte in range(0x80, 0x100):
              try:
                  cp1252_inverse[bytes([byte]).decode("cp1252")] = byte
              except UnicodeDecodeError:
                  pass

          def reversible_mojibake(line):
              raw = bytearray()
              for char in line:
                  codepoint = ord(char)
                  if codepoint <= 0xFF:
                      raw.append(codepoint)
                  elif char in cp1252_inverse:
                      raw.append(cp1252_inverse[char])
                  else:
                      return None
              try:
                  candidate = bytes(raw).decode("utf-8")
              except UnicodeDecodeError:
                  return None
              return candidate if candidate != line else None

          for path in sorted(res.glob("values*/strings.xml")):
              for line_number, line in enumerate(
                      path.read_text(encoding="utf-8").splitlines(), 1):
                  candidate = reversible_mojibake(line)
                  if candidate is not None:
                      failures.append(
                          f"{path}:{line_number}: probable UTF-8 mojibake"
                      )

          for locale in (node.attrib[android_name] for node in locale_root):
              if locale == "en":
                  continue
              parts = locale.split("-")
              qualifier = f"values-{parts[0]}"
              if len(parts) == 2 and len(parts[1]) == 2:
                  qualifier += f"-r{parts[1].upper()}"
              path = res / qualifier / "strings.xml"
              if not path.exists():
                  failures.append(f"{locale}: missing {path}")
                  continue
              root = ET.parse(path).getroot()
              present = {
                  node.attrib["name"]
                  for node in root
                  if node.tag in {"string", "plurals"}
              }
              missing = sorted(required - present)
              extra = sorted(present - required)
              if missing or extra:
                  failures.append(
                      f"{locale}: missing={missing or '[]'} extra={extra or '[]'}"
                  )

          if failures:
              raise SystemExit("\n".join(failures))
          print("All localized resources match the default translatable resource set.")
          PY

      - name: Unit tests, lint and debug build
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --no-daemon

      - name: Verify APK has no Internet permission
        shell: bash
        run: |
          BUILD_TOOLS="$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          AAPT="$ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt"
          "$AAPT" dump permissions app/build/outputs/apk/debug/app-debug.apk | tee permissions.txt
          if grep -q 'android.permission.INTERNET' permissions.txt; then
            echo 'Unexpected INTERNET permission found.' >&2
            exit 1
          fi

      - name: Reject sensitive Wi-Fi logging
        shell: bash
        run: |
          if grep -RInE 'Log\.[A-Za-z]+\([^;]*(SSID|BSSID|WifiInfo|password)' app/src/main/java; then
            echo 'Potential sensitive Wi-Fi logging detected.' >&2
            exit 1
          fi

      - name: Upload debug APK and lint report
        uses: actions/upload-artifact@v4
        with:
          name: thor-wifi-recovery-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/reports/lint-results-debug.html
