name: Signed release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-signed-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Restore release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required signing secret: $name" >&2
              exit 1
            fi
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/thor-release.keystore"
          cat > signing.properties <<EOF
          storeFile=$RUNNER_TEMP/thor-release.keystore
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Verify tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n "s/^[[:space:]]*versionName '\([^']*\)'.*/\1/p" app/build.gradle | head -n1)"
          EXPECTED="v$VERSION"
          if [ "$GITHUB_REF_NAME" != "$EXPECTED" ]; then
            echo "Tag $GITHUB_REF_NAME does not match app version $EXPECTED" >&2
            exit 1
          fi

      - name: Unit tests, lint and signed release build
        run: ./gradlew testDebugUnitTest lintDebug assembleRelease --no-daemon

      - name: Verify signed APK and permissions
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"
          AAPT="$ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt"
          APK="app/build/outputs/apk/release/app-release.apk"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          "$AAPT" dump permissions "$APK" | tee permissions.txt
          if grep -q 'android.permission.INTERNET' permissions.txt; then
            echo 'Unexpected INTERNET permission found.' >&2
            exit 1
          fi

      - name: Prepare release artifacts and changelog
        id: package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n "s/^[[:space:]]*versionName '\([^']*\)'.*/\1/p" app/build.gradle | head -n1)"
          LABEL="v$VERSION"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            LABEL="$GITHUB_REF_NAME"
          fi

          mkdir -p release-artifacts
          APK_NAME="Thor-WiFi-Recovery-${VERSION}.apk"
          cp app/build/outputs/apk/release/app-release.apk "release-artifacts/$APK_NAME"
          (
            cd release-artifacts
            sha256sum "$APK_NAME" > "$APK_NAME.sha256"
          )

          PREVIOUS_TAG="$(git tag --sort=-version:refname | grep -vx "$LABEL" | head -n1 || true)"
          {
            echo "# $LABEL"
            echo
            if [ -n "$PREVIOUS_TAG" ]; then
              echo "## Changes since $PREVIOUS_TAG"
              echo
              git log --pretty='- %s (%h)' "$PREVIOUS_TAG..HEAD"
            else
              echo "## Changes"
              echo
              git log --pretty='- %s (%h)' -n 20
            fi
            echo
            echo "## APK"
            echo
            printf '%s\n' '```'
            cat "release-artifacts/$APK_NAME.sha256"
            printf '%s\n' '```'
            echo
            echo "Built automatically from the tagged commit. The workflow verifies the release signature and confirms that the APK has no Internet permission."
          } > release-artifacts/RELEASE_NOTES.md

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "label=$LABEL" >> "$GITHUB_OUTPUT"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload signed build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: thor-wifi-recovery-${{ steps.package.outputs.version }}
          path: release-artifacts/
          if-no-files-found: error

      - name: Publish GitHub release for tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.package.outputs.label }}
          APK_NAME: ${{ steps.package.outputs.apk_name }}
        shell: bash
        run: |
          set -euo pipefail
          FLAGS=()
          if [[ "$TAG" == *-* ]]; then
            FLAGS+=(--prerelease)
          fi
          gh release create "$TAG"             "release-artifacts/$APK_NAME"             "release-artifacts/$APK_NAME.sha256"             --title "$TAG"             --notes-file release-artifacts/RELEASE_NOTES.md             "${FLAGS[@]}"
